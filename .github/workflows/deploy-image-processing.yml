name: Deploy image processing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript and tests
        run: |
          npm run typecheck
          npm test -- --run

      - name: Create deployment configuration
        env:
          CAPTURE_D1_DATABASE_ID: ${{ secrets.CAPTURE_D1_DATABASE_ID }}
        run: |
          test -n "$CAPTURE_D1_DATABASE_ID"
          cp apps/image-processing-worker/wrangler.example.jsonc apps/image-processing-worker/wrangler.jsonc
          sed -i "s/00000000-0000-0000-0000-000000000000/$CAPTURE_D1_DATABASE_ID/" apps/image-processing-worker/wrangler.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply CAPTURE_DB --remote --config apps/image-processing-worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build container and deploy Worker
        run: npx wrangler deploy --config apps/image-processing-worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
